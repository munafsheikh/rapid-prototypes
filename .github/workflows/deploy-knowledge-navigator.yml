name: Deploy Knowledge Navigator

on:
  push:
    branches: [main]
    paths:
      - 'knowledge-navigator/**'
      - '.github/workflows/deploy-knowledge-navigator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-navigator-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledge-navigator
    env:
      SUPABASE_PROJECT_ID: bbrnvdqbyvvhhgjmymda
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Missing SUPABASE_ACCESS_TOKEN' && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo 'Missing SUPABASE_DB_PASSWORD' && exit 1)

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --include-all

      - name: Deploy Edge Function
        run: supabase functions deploy knowledge-navigator --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Verify deployed endpoint
        run: curl --fail --retry 5 --retry-delay 5 "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/knowledge-navigator?action=list"
